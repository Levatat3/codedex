[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codedex"
version = "0.1.0"
description = "Find your own code by what it does, not what the folder is called."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Tyler", email = "tybot43@gmail.com" }]
keywords = ["search", "index", "projects", "docstring", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Levatat3/codedex"

[project.scripts]
codedex = "codedex:main"

[tool.setuptools]
py-modules = ["codedex"]
